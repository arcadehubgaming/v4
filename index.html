<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="favicon" rel="icon" href="" type="image/png">
</head>
<body>
    <div class="site-container">
        <header class="topbar-container">
            <div class="topbar">
                <div class="logo">Arcade Hub</div>
                <div class="sidebar-toggle sidebar-toggle-selected">
                    <i class="fas fa-gamepad"></i>
                    Games
                </div>
                <div class="sidebar-toggle">
                    <i class="fas fa-film"></i>
                    Movies
                </div>
                <div class="sidebar-toggle">
                    <i class="fas fa-user"></i>
                    Proxies
                </div>
                <div class="sidebar-toggle">
                    <i class="fas fa-gear"></i>
                    Settings
                </div>
                <a href="https://forms.gle/fADC7cR7Jv6T2ZYu8" target="_blank" style="text-decoration: none;">
                    <div class="sidebar-toggle">
                        <i class="fas fa-comments"></i>
                        Feedback
                    </div>
                </a>
                <input class="search-input" placeholder="Search">
            </div>
        </header>
        <br/>
        <main class="body">
            <div class="games item-list">
            </div>
            <div class="movies item-list">

            </div>
            <div class="proxies item-list">

            </div>
            <div class="settings item-list">
                <div class="theme-selector">
                    <select id="theme-select">
                        <option value="default">Light Mode</option>
                        <option value="dark">Dark</option>
                        <option value="fall">Fall</option>
                        <option value="winter">Winter</option>
                        <option value="oxocarbon-dark">Oxocarbon Dark</option>
                        <option value="oxocarbon-light">Oxocarbon</option>
                        <option value="catppuccin-latte">Catppuccin Latte</option>
                        <option value="catppuccin-frappe">Catppuccin Frappe</option>
                        <option value="catppuccin-macchiato">Catppuccin Macchiato</option>
                        <option value="catppuccin-mocha">Catppuccin Mocha</option>
                    </select>
                </div>
                <div class="cloaker toggle-container">
                    <label class="toggle">
                        <input type="checkbox" id="cloaking-toggle">
                        <span class="slider"></span>
                        <span class="toggle-label">Enable Cloaking</span>
                    </label>
                </div>
                <div class="history-wiper">
                    <a href="misc/history-clearer/chrome.bat" onclick="alert('Close Chrome before using this script.')">
                        <div class="btn poppins-btn">Delete History Manually (Chrome)</div>
                    </a>
                    <a href="misc/history-clearer/edge.bat" onclick="alert('Close Edge before using this script. ')">
                        <div class="btn poppins-btn">Delete History Manually (Edge)</div>
                    </a>
                </div>                      
            </div>
        </main>
    </div>
    <div id="snowTarget" style="background:transparent; color:transparent; height: 1px; width: 100%"></div>

    <script>var ArcadeHubItems = {};</script> 
    <script src="js/items/games.js"></script>
    <script src="js/items/movies.js"></script>
    <script src="js/items/proxies.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
